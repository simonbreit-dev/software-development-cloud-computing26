name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "charts/sdfcc-backend/**"
      - "openApiSpec.yaml"
      - "Makefile"
      - ".dockerignore"
      - ".env.example"
      - "docker-compose*.yml"
      - "observability/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "backend/**"
      - "charts/sdfcc-backend/**"
      - "openApiSpec.yaml"
      - "Makefile"
      - ".dockerignore"
      - ".env.example"
      - "docker-compose*.yml"
      - "observability/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sdfcc-backend
  CHART_PATH: charts/sdfcc-backend

jobs:
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Validate OpenAPI spec
        run: make validate-spec

      - name: Check generated OpenAPI sources
        run: make check-generated

      - name: Maven verify
        working-directory: backend
        run: ./mvnw -B clean verify

      - name: Publish JUnit test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "backend/target/surefire-reports/*.xml"
          check_name: "Backend JUnit Tests"
          fail_on_failure: false
          require_tests: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: |
            backend/target/site/jacoco/
            backend/target/jacoco.exec
          if-no-files-found: ignore

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/target/*.jar
          if-no-files-found: ignore

      - name: Set up QEMU for multi-platform publishing
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker image metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=ci,enable=${{ github.event_name == 'pull_request' }}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image,ignore-error=true
          sbom: ${{ github.event_name == 'push' }}
          provenance: ${{ github.event_name == 'push' }}

      - name: Smoke test built image
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cleanup() {
            BACKEND_IMAGE="${REGISTRY}/${IMAGE_NAME}:ci" docker compose -f docker-compose.yml down --volumes
            docker network rm observability_observability || true
          }
          trap cleanup EXIT

          docker network create observability_observability
          BACKEND_IMAGE="${REGISTRY}/${IMAGE_NAME}:ci" docker compose -f docker-compose.yml up --detach --no-build --wait --wait-timeout 180
          curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness

  deployment-config:
    name: Validate deployment configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose --profile bundled-postgres config --quiet
          docker compose -f docker-compose.yml config --quiet
          docker compose -f observability/compose.yaml config --quiet

      - name: Lint and render Helm chart
        run: |
          helm lint "${CHART_PATH}" -f "${CHART_PATH}/examples/values-ci.yaml"
          helm template sdfcc-backend "${CHART_PATH}" -f "${CHART_PATH}/examples/values-ci.yaml" >/dev/null
          helm template sdfcc-backend "${CHART_PATH}" -f "${CHART_PATH}/examples/values-ci.yaml" -f "${CHART_PATH}/examples/values-ingress.yaml" >/dev/null
          helm template sdfcc-backend "${CHART_PATH}" -f "${CHART_PATH}/examples/values-ci.yaml" -f "${CHART_PATH}/examples/values-npm-nodeport.yaml" >/dev/null

  helm-chart:
    name: Package and publish Helm chart
    runs-on: ubuntu-latest
    needs:
      - backend
      - deployment-config
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Compute Helm chart version
        id: chart-version
        shell: bash
        run: |
          base_version="$(awk '/^version:/ {print $2; exit}' "${CHART_PATH}/Chart.yaml" | tr -d '"')"
          short_sha="${GITHUB_SHA::7}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            chart_version="${GITHUB_REF_NAME#v}"
            app_version="${GITHUB_REF_NAME}"
          else
            chart_version="${base_version}-sha-${short_sha}"
            app_version="sha-${short_sha}"
          fi

          echo "chart-version=${chart_version}" >> "${GITHUB_OUTPUT}"
          echo "app-version=${app_version}" >> "${GITHUB_OUTPUT}"

      - name: Package Helm chart
        run: |
          mkdir -p .helm-packages
          helm package "${CHART_PATH}" \
            --version "${{ steps.chart-version.outputs.chart-version }}" \
            --app-version "${{ steps.chart-version.outputs.app-version }}" \
            --destination .helm-packages

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" --username "${{ github.actor }}" --password-stdin

      - name: Push Helm chart to GitHub Container Registry
        run: helm push .helm-packages/*.tgz "oci://${REGISTRY}/${{ github.repository }}/charts"
