name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "charts/sdfcc-backend/**"
      - "openApiSpec.yaml"
      - "Makefile"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "charts/sdfcc-backend/**"
      - "openApiSpec.yaml"
      - "Makefile"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

env:
  BACKEND_IMAGE_LOCAL: sdfcc-backend:${{ github.sha }}
  CHART_PATH: charts/sdfcc-backend

jobs:
  backend-ci:
    name: Build, test and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Validate OpenAPI spec
        run: make validate-spec

      - name: Check generated OpenAPI sources
        run: make check-generated

      - name: Maven verify
        working-directory: backend
        run: ./mvnw -B clean verify

      - name: Publish JUnit test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "backend/target/surefire-reports/*.xml"
          check_name: "Backend JUnit Tests"
          fail_on_failure: true
          require_tests: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: |
            backend/target/site/jacoco/
            backend/target/jacoco.exec
          if-no-files-found: ignore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/target/*.jar
          if-no-files-found: error

      - name: Build backend image locally
        run: docker build -f backend/Dockerfile -t "${BACKEND_IMAGE_LOCAL}" .

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.BACKEND_IMAGE_LOCAL }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint "${CHART_PATH}"

      - name: Template Helm chart
        run: helm template sdfcc-backend "${CHART_PATH}"