name: Quality

on:
  pull_request:
    paths:
      - "backend/**"
      - "openApiSpec.yaml"
      - "Makefile"
      - ".github/workflows/quality.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "openApiSpec.yaml"
      - "Makefile"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

jobs:
  local-quality:
    name: Local quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Verify with coverage
        working-directory: backend
        run: ./mvnw -B clean verify
