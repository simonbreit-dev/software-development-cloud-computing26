name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sdfcc-backend
  CHART_PATH: charts/sdfcc-backend

jobs:
  publish-image:
    name: Publish backend image
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.version.outputs.image-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image version
        id: version
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            image_tag="${GITHUB_REF_NAME}"
          else
            image_tag="sha-${short_sha}"
          fi

          echo "image-tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.image-tag }}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

  publish-chart:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    needs: publish-image

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint "${CHART_PATH}"

      - name: Template Helm chart
        run: helm template sdfcc-backend "${CHART_PATH}"

      - name: Compute Helm chart version
        id: chart-version
        shell: bash
        run: |
          base_version="$(awk '/^version:/ {print $2; exit}' "${CHART_PATH}/Chart.yaml" | tr -d '"')"
          short_sha="${GITHUB_SHA::7}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            chart_version="${GITHUB_REF_NAME#v}"
            app_version="${GITHUB_REF_NAME}"
          else
            chart_version="${base_version}-sha-${short_sha}"
            app_version="sha-${short_sha}"
          fi

          echo "chart-version=${chart_version}" >> "${GITHUB_OUTPUT}"
          echo "app-version=${app_version}" >> "${GITHUB_OUTPUT}"

      - name: Package Helm chart
        run: |
          mkdir -p .helm-packages
          helm package "${CHART_PATH}" \
            --version "${{ steps.chart-version.outputs.chart-version }}" \
            --app-version "${{ steps.chart-version.outputs.app-version }}" \
            --destination .helm-packages

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" --username "${{ github.actor }}" --password-stdin

      - name: Push Helm chart to GitHub Container Registry
        run: helm push .helm-packages/*.tgz "oci://${REGISTRY}/${{ github.repository }}/charts"