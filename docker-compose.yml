name: ${COMPOSE_PROJECT_NAME:-sdfcc}

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MAVEN_BUILD_ARGS: ${MAVEN_BUILD_ARGS:--DskipTests}
    image: ${BACKEND_IMAGE:-sdfcc-backend:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    ports:
      - "${BACKEND_HTTP_BIND:-127.0.0.1:8080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME:-sdfcc-backend}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      APP_SECURITY_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/sdfcc}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-sdfcc}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-sdfcc}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:-org.hibernate.dialect.PostgreSQLDialect}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-sdfcc-backend}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=sdfcc,deployment.environment=local}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      JAVA_OPTS: ${JAVA_OPTS:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app
      - observability

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sdfcc}
      POSTGRES_USER: ${POSTGRES_USER:-sdfcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdfcc}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app

networks:
  app:
    driver: bridge
  observability:
    external: true
    name: ${OBSERVABILITY_NETWORK:-observability_observability}

volumes:
  postgres_data:
